# A protoAgent plugin BUNDLE (ADR 0040) — the Project Manager tier of the
# portfolio→team hierarchy. This is the DEDICATED bundle repo the archetype
# catalog installs (protoAgent's archetype-catalog.json `project-manager` row);
# the persona ships as protoAgent's `project-manager` soul preset. Dogfooded on
# the protoAgent repo itself (2026-07), then frozen. Development/reference host:
# github.com/protoLabsAI/leadEngineer.
#
# Install (onto any host):  python -m server plugin install <this-repo-url>
#
# A Project Manager focuses on ONE repo and a set of coding agents. The Portfolio
# Manager tier (portfolio plugin, ADR 0055) treats each Project Manager as a board it
# can dispatch to over A2A and read back — so this bundle is deliberately the team
# subset of the old pm-stack: project_board (runs the board + spawn loop) WITHOUT
# portfolio (that's the manager-of-teams, a separate bundle).
#
# FIRST-RUN SETUP — mostly ASKED, not discovered. On core >= 0.144.0 the create
# flow (Setup Wizard / New Agent panel) renders this manifest's `config_inputs:`
# as a Configure step: the board repo (required), the coder delegate (required —
# a dropdown of the host's registered ACP delegates), the GitHub repo, and the
# loop toggle are collected up front and written into the agent's config. What
# that step CANNOT conjure, and how the archetype covers each gap:
#
# 1. A coder delegate must EXIST on the host. Coding delegates are host-installed
#    binaries (ABSOLUTE command paths — GUI hosts don't inherit your shell PATH),
#    so the dropdown may honestly say "No delegates configured". Two ways out:
#    register one in Settings ▸ Delegates, or let the agent `propose_delegate`
#    (core >= 0.145) — it validates + probes the entry and PARKS for your
#    approval; nothing registers without it. Tier ladder alternative to the
#    single `coder:`:
#      project_board:
#        coders: { smart: claude-code, reasoning: opus }   # small→smart, medium/large→reasoning
# 2. Ground the repo: the `onboard_project` tool / `onboard-project` skill scans
#    the bound repo, declares the local gate command, registers it in the ADR
#    0095 `projects:` registry (fs tools + github picker + board all read it),
#    and writes the grounding doc. Requires the host's `onboarding.enabled` +
#    `onboarding.root` consent gate. Pin `db_path` to a private store if the
#    target repo commits its own .beads/.
# 3. The loop ships OFF unless the Configure step's toggle says otherwise — a
#    spawn loop with no repo or coder can only thrash. Flip it in Settings any
#    time (`project_board.loop_enabled`).
# 4. The review gate ships ON and RUNNABLE: the `workflows` member below provides
#    the runner + the bundled `code-review` recipe, so every PR passes an
#    adversarial review before it settles into in_review. An unrunnable gate
#    fails CLOSED (cards block with the reason) — never silently advisory.
# 5. Scope the github write rail: `github.write` ships true (the persona files
#    issues — its capability contract depends on it); bind `github.repos` /
#    `default_repo` per-host, and the GH_TOKEN's scope bounds real capability.
#
# PIN LIFECYCLE (ADR 0049): members are pinned to release TAGS and only move through
# a passing verify (scripts/ + .github/workflows/verify-bundle.yml install this
# manifest into a scratch agent and probe every declared console view). Keep member
# entries on ONE line — scripts/check_bundle_updates.py rewrites the `ref:` in place.

id: project-manager-archetype
name: Project Manager
description: >-
  A single-repo project manager — the bridge between an operator's intent and the
  team that ships it. It reads code deeply but never holds the keyboard: its file
  tools are read-only, and every change ships through the board — decomposed into
  features, dispatched to a coding agent in a disposable per-feature git worktree,
  opened as a PR, walked through review, and reported as it merges to done. The
  project-team counterpart of the Portfolio Manager (ADR 0055) — built to be
  delegated to, and to report back. Composes the delegates spine + project_board
  (the board + spawn loop) + a read-only GitHub rail + a browser for verification.
  Portfolio orchestration is intentionally NOT bundled here.

# The core version this exact pin set was last verified against (ADR 0049). The
# verify workflow checks out this protoAgent ref for the smoke — bump on re-verify.
verified_against: 0.144.0

plugins:
  - { id: delegates, builtin: true }                                                  # ACP/A2A spawn spine — ships with protoAgent
  - { id: workflows, builtin: true }                                                  # the review gate's RUNNER + the bundled code-review recipe
  - { id: friction,  builtin: true }                                                  # write-only harness-friction ledger — pain points leave evidence
  - { id: project_board, url: https://github.com/protoLabsAI/projectBoard-plugin,  ref: v0.41.2 }
  - { id: agent_browser, url: https://github.com/protoLabsAI/agent-browser-plugin, ref: v0.6.4 }
  - { id: github,        url: https://github.com/protoLabsAI/github-plugin,        ref: v0.4.0 }

# workflows: without it the M5 review gate below is UNRUNNABLE — the board probes
# STATE.workflow_run, finds nothing, and (correctly, fail-closed) blocks every
# reviewed card with "no workflow runner available" after 3 attempts. The plugin
# ships the code-review recipe (parallel finders → synthesizer → verifier) the gate
# runs; a boot warning "config_section 'workflows' collides with a built-in —
# ignored" is benign. friction: every tool exception auto-records to the member's
# friction.jsonl — the ledger that turns a rough first day into filed issues
# instead of vanished evidence.
enabled: [delegates, workflows, friction, project_board, agent_browser, github]   # suggested turn-on list (you apply it)

# Create-time setup prompts (#2934, core >= 0.144.0) — the Configure step in the
# Setup Wizard and the fleet New Agent panel renders these and writes the answers
# into the created agent's config at the dotted keys. This is what makes the
# FIRST-RUN SETUP steps above get ASKED instead of discovered: without a repo the
# board can't init, and without a coder delegate the archetype has no one to
# dispatch builds to (the operator-reported first-run miss, 2026-08-21). The
# delegate dropdown lists the host's configured ACP delegates — "No delegates
# configured" means register one first (Settings ▸ Delegates, absolute command
# path). Older cores ignore this block.
config_inputs:
  - { key: project_board.repo,  label: "Repo this board manages (absolute path to the git checkout)", type: path, required: true }
  - { key: project_board.coder, label: "Coder delegate the board dispatches builds to", type: delegate, required: true }
  - { key: github.default_repo, label: "GitHub repo (owner/name) for issues and PRs", type: string }
  - { key: project_board.loop_enabled, label: "Start the build loop now (needs the repo + coder above)", type: boolean, default: false }
config:                                              # recommended defaults (you apply them)
  # The lead reads, the pipeline writes (the PM-archetype invariant): file-mutation
  # tools are removed from the lead's palette entirely — investigation stays
  # (list/read/find/search), every change ships through the board. This is what
  # makes "fix the brief, not the file" structural instead of aspirational.
  tools:
    disabled: [write_file, edit_file, delete_file]
  # Guarded self-persona editor (ADR 0081): every edit_soul is snapshotted to
  # config/soul-history and reversible — the same trail this archetype was frozen from.
  soul:
    self_edit_enabled: true
  project_board:
    # NO coder default — see FIRST-RUN SETUP above. Set `coder:` or `coders:` after
    # registering your host's delegates.
    #
    # The loop ships OFF (first-run safety): until a repo and coder are bound,
    # an enabled spawn loop points at the unbound default repo "." — on a desktop
    # member that cwd is read-only and the board can't even `br init`. The
    # Configure step's toggle (config_inputs below) flips it at create time;
    # Settings ▸ Plugins ▸ Project Board any time after.
    loop_enabled: false
    # Blocking adversarial review (board v0.30.0, plan M5): after each PR opens, the
    # loop runs the host's `code-review` workflow (protoAgent ADR 0077) and bounces
    # blocking findings back to the coder. Self-contained review out of the box; a
    # host with an external PR-review fleet can turn this off and drive fix rounds
    # through `POST /features/{fid}/review` (board v0.34.0) instead.
    review_gate: true
    review_fix_max: 2
  github:
    # WRITE rail ON (operator call, 2026-08-21): the bundle ships the github plugin
    # AND the archetype's capability contract requires `github_create_issue` (the
    # persona files the pain points it finds) — seeding write:false suppressed the
    # very tool the contract declares, so every fresh agent booted straight into a
    # capability-contract banner. write:true registers the write + review toolset;
    # merges stay human, `/issue` stays a user-only chat command, and the GH_TOKEN
    # scope + per-host `repos:` binding bound what it can actually touch.
    write: true
  agent_browser:
    panel_mode: full

# Agent archetype (ADR 0042) — presents this bundle as a "Project Manager" agent type
# in the new-agent picker. Additive metadata; it doesn't change the bundle shape.
archetype:
  label: Project Manager
  icon: ClipboardList
  blurb: Single-repo project manager — reads deeply, never holds the keyboard; ships every change through a board of coding agents and reports back as it merges.
  # Capability contract (#2277, ADR 0100): the persona commits to filing issues, so a
  # direct bundle install self-registers with the same contract the core catalog row
  # carries — satisfiable out of the box now that `github.write` seeds true above.
  requires_tools: [github_create_issue]
